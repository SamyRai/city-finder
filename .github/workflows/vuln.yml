name: Vulnerability scan

# Weekly govulncheck on main. A new stdlib or dependency advisory lands
# without any commit here, so the push-triggered scan in ci.yml stays silent
# until the next unrelated change (or tag) trips it. This small scheduled job
# surfaces it within a week without re-running the whole suite.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-latest: resolve the newest 1.26 patch, not the runner's cached
      # one, so already-fixed stdlib advisories are not reported.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      # Keep this version identical to the "Scan reachable vulnerabilities"
      # step in ci.yml.
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
