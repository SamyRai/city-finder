name: CI

# PR branches run only the pull_request event. An all-branch push trigger
# started a second run in the same concurrency group, and its cancellation
# left red checks on every PR head. v* tags are not listed: release.yml calls
# this workflow and gates publishing on it, so a tag runs the suite once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  # Called by release.yml so a v* tag cannot publish unless the suite is green.
  workflow_call:
    inputs:
      called:
        description: "Set by a calling workflow; moves this run to its own concurrency group."
        type: boolean
        default: false

# In a called workflow github.workflow and github.ref_name are the CALLER's,
# so the group below would equal the caller's own group. A caller and callee
# in one group deadlock (the callee waits on the caller, which waits on the
# callee) or, with cancel-in-progress, cancel the caller. A called run
# therefore gets a group unique to its run and never queues or cancels.
concurrency:
  group: ${{ inputs.called && format('ci-called-{0}-{1}', github.run_id, github.run_attempt) || format('{0}-{1}', github.workflow, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ !inputs.called }}

permissions:
  contents: read

jobs:
  go-ci:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # check-latest: a runner image's cached Go can lag the newest 1.26
      # patch, and govulncheck then fails on already-fixed stdlib advisories.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify downloaded modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Build packages
        run: go build ./...

      - name: Run tests
        run: go test -v -race ./...

      # Every benchmark once, WITHOUT -race (instrumented binaries are 2-20x
      # slower and not what ships). Correctness only: it proves benchmarks
      # still build, find their fixtures and pass their own assertions. The
      # numbers from a shared runner are noise and are deliberately ignored.
      - name: Benchmark smoke run
        run: benchmarks/bench.sh smoke

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Config in .golangci.yml; version pinned with the Makefile's
      # GOLANGCI_LINT_VERSION so `make verify` and CI agree.
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check go mod tidy
        run: go mod tidy -diff

  # Chart gate: lint + render (default and full-feature permutations) against
  # the Kubernetes schemas. Runs parallel to go-ci; the only shared state is
  # the checkout.
  helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned kubeconform, invoked via go run: the build lands in the module
      # cache, so the second validation step reuses it.
      KUBECONFORM: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint chart
        run: helm lint helm/city-finder

      # The image tag defaults to appVersion, so a stale appVersion silently
      # deploys an old server. It must equal the newest released version in
      # CHANGELOG.md (the first "## [x.y.z]" heading after [Unreleased]).
      - name: Check chart appVersion matches the latest release
        shell: bash
        run: |
          app="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' helm/city-finder/Chart.yaml)"
          rel="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | head -1 | tr -d '#[] ')"
          echo "Chart appVersion=${app} latest CHANGELOG release=${rel}"
          [ -n "${app}" ] && [ "${app}" = "${rel}" ]

      # shell: bash gives -eo pipefail: without pipefail a failing
      # `helm template` would hand kubeconform an empty stream and exit 0.
      - name: Validate rendered manifests (default values)
        shell: bash
        run: helm template helm/city-finder | $KUBECONFORM -strict -summary

      - name: Validate rendered manifests (full-feature permutation)
        shell: bash
        run: |
          helm template helm/city-finder \
            --set persistence.enabled=true \
            --set ingress.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set replicaCount=2 \
            | $KUBECONFORM -strict -summary
