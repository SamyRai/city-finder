openapi: 3.0.3
info:
  title: cityFinder API
  version: 1.1.0
  description: |
    HTTP API of the city-finder server (cmd/server/routes/routes.go), which
    serves nearest-city, name, and postal-code lookups over pre-built
    GeoNames indexes.

    This spec mirrors the handler code exactly. Error responses (400/404/500)
    are plain text strings, not JSON, because the handlers use Fiber's
    `SendString`; the exact response body is given in each example.

    The server listens on port 3000 by default (`PORT` overrides it), enforces
    read/write/idle timeouts (15s/15s/60s), a 1 MB body limit, recovers from
    handler panics, and shuts down gracefully on SIGINT/SIGTERM.
servers:
  - url: http://localhost:3000
    description: Local server (default port)
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: >
        Returns `{"status":"ok"}`. Registered before the data routes and never
        touches the indexes, so it stays cheap and answers even when data
        loading is slow or the indexes are degraded.
      operationId: healthz
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /metrics:
    get:
      summary: Prometheus metrics
      description: >
        Text exposition (format version 0.0.4): `http_requests_total`
        counters and `http_request_duration_seconds` histograms keyed by
        route pattern and status code (label cardinality is bounded —
        never by user input), plus `fuzzy_budget_trips_total` (fuzzy
        searches that returned budget-truncated partial results). The
        scrape does not count itself.
      operationId: metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
              example: "http_requests_total{path=\"/nearest\",status=\"200\"} 42"
  /nearest:
    get:
      summary: Find the nearest city to a coordinate pair
      operationId: nearest
      description: |
        Returns the indexed city closest to the query point plus the
        great-circle distance. With `rank=population` the winner maximizes
        the gravity score population / (distance_km² + 1) over ALL indexed
        cities (exact: escalating-radius search under an anytime bound) and
        the response additionally carries `Population`. With `include=admin`
        the response additionally carries the winning city's administrative
        region (`admin1_code`, `admin1_name`, `admin2_code`). Land queries
        resolve in microseconds-to-milliseconds; sparse/ocean points fall
        back to a wider scan (a top-4096 population table keeps even those
        off the full-sphere scan in almost all cases). Concurrent
        population-ranked queries are gated by a CPU-sized semaphore:
        saturation returns 503 with Retry-After: 1 instead of queueing.

        Admin attribution is the region of the NEAREST (or
        population-ranked) city — not polygon containment: near a boundary
        the reported region follows the closest city, which may sit across
        the line. `admin1_name` is served only when the optional
        admin1CodesASCII dataset was loaded (codes-only deployments omit it);
        `admin2_code` is omitted when the winning city has none.

        Validation order mirrors the handler: `lat` must parse as a finite
        number (NaN and ±Inf are rejected, as is any non-numeric value
        including a missing parameter, which arrives as an empty string);
        then `lon` the same way; then `lat` is range-checked against
        [-90, 90]; then `lon` against [-180, 180]; then `rank` (if present
        and non-empty) must be exactly `distance` or `population`
        (case-sensitive); then `include` (if present and non-empty) must be
        exactly `admin` (case-sensitive).
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude in degrees. Must be a finite number.
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: 40.7128
        - name: lon
          in: query
          required: true
          description: Longitude in degrees. Must be a finite number.
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: -74.006
        - name: rank
          in: query
          required: false
          description: >
            Ranking mode. `distance` (default; also when the parameter is
            absent or empty) returns the closest city and omits `Population`.
            `population` returns the gravity-score winner
            (population / (distance_km² + 1)) and includes `Population`.
          schema:
            type: string
            enum: [distance, population]
            default: distance
          example: population
        - name: include
          in: query
          required: false
          description: >
            Optional response enrichment. `admin` (the only accepted value;
            absent or empty keeps the plain v1.0 response) appends the
            winning city's administrative region: `admin1_code`,
            `admin1_name` (when the optional names dataset is loaded), and
            `admin2_code` (when the city has one). Attribution follows the
            nearest city, not polygon containment — near a boundary it may
            report the region across the line.
          schema:
            type: string
            enum: [admin]
          example: admin
      responses:
        "200":
          description: >
            The matched city and its distance from the query point. With
            rank=population the body additionally includes `Population`
            (int32, the winner's GeoNames population; 0 when unknown). With
            include=admin the body additionally includes `admin1_code`
            (raw per-country code, e.g. "06"), `admin1_name` (present only
            when the optional names dataset is loaded; omitted in codes-only
            deployments), and `admin2_code` (omitted when the city has
            none), in that order after `distance_km`. Requests without these
            options return the exact v1.0 body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearestCityResponse"
              example:
                Latitude: 37.7749
                Longitude: -122.4194
                Name: San Francisco
                Country: US
                Population: 808437
                distance_km: 0.57
                admin1_code: "06"
                admin1_name: California
                admin2_code: "075"
        "400":
          description: >
            Malformed or out-of-range coordinates, an unrecognized rank
            value, or an unrecognized include value. Plain text; the body is
            exactly one of the strings below, chosen by the validation order.
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidLat:
                  value: "Invalid latitude"
                invalidLon:
                  value: "Invalid longitude"
                latOutOfRange:
                  value: "Latitude must be between -90 and 90"
                lonOutOfRange:
                  value: "Longitude must be between -180 and 180"
                invalidRank:
                  value: "Invalid rank"
                invalidInclude:
                  value: "Invalid include"
        "404":
          description: >
            No city indexed. Plain text; `lat` and `lon` are the parsed query
            values formatted with %f (always six decimal places).
          content:
            text/plain:
              schema:
                type: string
              example: "City not found for lat: 0.000000, lon: 0.000000"
        "500":
          description: Finder error. Plain text.
          content:
            text/plain:
              schema:
                type: string
              example: "internal server error"
        "503":
          description: >
            Population ranking is saturated (too many concurrent
            rank=population queries). Plain text; carries
            `Retry-After: 1`.
          content:
            text/plain:
              schema:
                type: string
              example: "population ranking is saturated, retry shortly"
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                example: 1
  /coordinates:
    get:
      summary: Find a city by exact or fuzzy name match
      operationId: coordinates
      description: |
        Looks up a city by name within one country. The name is matched
        exactly first, then fuzzily (edit distance <= 2), so typos still
        resolve. `name` and `country-code` are trimmed of surrounding
        whitespace; `country-code` is additionally uppercased. Both are
        required: `name` is validated first, then `country-code`.
      parameters:
        - name: name
          in: query
          required: true
          description: >
            City name (trimmed). Matched exactly, then fuzzily within the
            country. Names longer than 200 runes return 400 (bounds the
            fuzzy path's query cost; real place names are far shorter).
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: Paris
        - name: country-code
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code (trimmed, uppercased).
          schema:
            type: string
            minLength: 1
          example: FR
      responses:
        "200":
          description: The matched city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
              example:
                Latitude: 48.8566
                Longitude: 2.3522
                Name: Paris
                Country: FR
        "400":
          description: >
            Missing parameter. Plain text; `name` is validated first, then
            `country-code`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                nameRequired:
                  value: "Name is required"
                countryCodeRequired:
                  value: "Country code is required"
        "404":
          description: No city matched. Plain text.
          content:
            text/plain:
              schema:
                type: string
              example: "City not found"
  /postalCode:
    get:
      summary: Find a city by postal code
      operationId: postalCode
      description: |
        Looks up the place indexed for a postal code within a country.
        Inner spaces in the postal code are significant (GeoNames stores GB
        codes as `SW1A 1AA`); only surrounding whitespace is trimmed, and the
        country code is trimmed and uppercased. `code` is validated first,
        then `country-code`.
      parameters:
        - name: code
          in: query
          required: true
          description: >
            Postal code (surrounding whitespace trimmed; inner spaces
            significant).
          schema:
            type: string
            minLength: 1
          example: SW1A 1AA
        - name: country-code
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code (trimmed, uppercased).
          schema:
            type: string
            minLength: 1
          example: GB
      responses:
        "200":
          description: The place indexed for the postal code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
              example:
                Latitude: 51.5074
                Longitude: -0.1278
                Name: London
                Country: GB
        "400":
          description: >
            Missing parameter. Plain text; `code` is validated first, then
            `country-code`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                codeRequired:
                  value: "Postal code is required"
                countryCodeRequired:
                  value: "Country code is required"
        "404":
          description: No place matched. Plain text.
          content:
            text/plain:
              schema:
                type: string
              example: "City not found"
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    City:
      type: object
      description: >
        A city as marshaled by encoding/json from lib/city.City, which has no
        json tags — the four field names are therefore capitalized exactly as
        below.
      required:
        - Latitude
        - Longitude
        - Name
        - Country
      properties:
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
        Name:
          type: string
        Country:
          type: string
    NearestCityResponse:
      type: object
      description: >
        The matched city plus `distance_km` (great-circle distance to the
        query point in kilometers, rounded to 2 decimal places). The city
        fields are the capitalized `City` fields; only the distance carries a
        snake_case json tag. `Population` (int32) appears ONLY when the
        request used rank=population; distance-ranked responses never
        include the key. The admin fields appear ONLY when the request used
        include=admin: `admin1_code` (raw per-country admin1 code) always,
        `admin1_name` only when the optional names dataset is loaded
        (codes-only deployments omit it), and `admin2_code` only when the
        winning city carries one. Attribution is the nearest city's region,
        not polygon containment — near a boundary it may report the region
        across the line.
      allOf:
        - $ref: "#/components/schemas/City"
        - type: object
          required:
            - distance_km
          properties:
            Population:
              type: integer
              format: int32
              description: >
                Winner's GeoNames population (field 14; 0 when the source
                row had none). Present only in rank=population responses.
            distance_km:
              type: number
              format: double
            admin1_code:
              type: string
              description: >
                Raw per-country admin1 code of the winning city (e.g. "06"
                for US-CA; "02" for AD-02). Present only in include=admin
                responses; omitted when the city carries no admin1 code.
              example: "06"
            admin1_name:
              type: string
              description: >
                Display name of the admin1 division (e.g. "California"), from
                the optional admin1CodesASCII dataset. Present only in
                include=admin responses AND only when that dataset is loaded;
                codes-only deployments omit the key.
              example: California
            admin2_code:
              type: string
              description: >
                Raw per-country admin2 code of the winning city (e.g. "075",
                San Francisco County). Present only in include=admin
                responses; omitted when the city carries no admin2 code
                (57.7% of GeoNames rows, and all admin2-less countries).
              example: "075"
