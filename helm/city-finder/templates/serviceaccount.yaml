{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "city-finder.serviceAccountName" . }}
  labels:
    {{- include "city-finder.labels" . | nindent 4 }}
  annotations:
    {{- include "city-finder.syncWave" (-2) | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
