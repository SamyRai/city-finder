# city-finder chart values.
#
# Sizing context (v1.2): name index 559 MB on disk, warm start ~15-20 s
# (three decodes run concurrently since v1.2), heap ~4.2-4.3 GB post-GC
# after the in-memory name-index flattening (was 5.5 GB in v1.0/v1.1; the
# flattening removed ~1.4 GB of nested-map overhead). Peak RSS is ≈9-10 GB
# warm (parallel decode adds ~0.5-1 GB transient over the v1.0 figure), up
# to ~11 GB with the fuzzy index built; population-rank scans are bounded
# by a CPU-sized query gate since v1.2. The defaults below (memory 10Gi
# request / 14Gi limit, 600 s startup-probe budget) still cover this with
# headroom — the two knobs to re-check on any future index-format change.
#
# Boot times the probes must tolerate:
#   - warm start, pre-built .gob indexes on the datasets volume: ~20 s (v2 indexes)
#   - cold start, empty volume (downloads ~420 MB, builds indexes): ~6-8 min
#     The default probe budget covers BOTH (see probes.startup below); a
#     cold start is still discouraged in-cluster — mount a volume with
#     pre-built indexes instead (see persistence below and README
#     "Deployment").
#
# ArgoCD: the chart encodes exactly one ordering constraint via
# argocd.argoproj.io/sync-wave annotations on resource metadata: the datasets
# PVC (wave -2) before the Deployment (wave 0). Auto-sync (prune +
# self-heal) is an Application-level setting in the cluster's ArgoCD
# registration; this repo intentionally ships NO Application/ApplicationSet
# manifest — adopting the chart into Harbor/ArgoCD is an ops handoff
# documented outside this repo.

replicaCount: 1

# Merged into the labels of every rendered resource AND the pod template, so
# cluster adoption can stamp ownership labels (e.g. glpx.dev/team, env,
# cluster, tier) without forking the chart. Do NOT set app.kubernetes.io/name
# or app.kubernetes.io/instance here: they are Deployment selector keys.
commonLabels: {}

image:
  # GHCR requires lowercase: github.repository_owner must be lowercased
  # before it is used in an image reference (the release workflow does this).
  repository: ghcr.io/samyrai/city-finder
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion; set to override (e.g. "1.0.0-rc1").
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The server talks to no Kubernetes API; create a dedicated service account
  # only so the pod identity is explicit, with no token automounted.
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

server:
  port: 3000
  # The image ships /etc/cityfinder/config.json with datasets_folder
  # /data/datasets. To use a custom config, mount it (extraVolumes /
  # extraVolumeMounts below) and point this at the mounted path.
  configPath: /etc/cityfinder/config.json
  # Additional env vars, e.g.:
  #   - name: GOMEMLIMIT
  #     value: "9GiB"
  extraEnv: []

podAnnotations: {}
podLabels: {}

# Nonroot uid/gid 65532 = the distroless "nonroot" user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Makes PVC-backed dataset volumes group-writable for the nonroot user.
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# The listener only opens after the indexes are loaded, so all probes gate on
# the startupProbe; initialDelay on the others is intentionally minimal.
probes:
  startup:
    enabled: true
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
    # 5s x 120 = 600 s budget. That is NOT sized to the warm start: the
    # default storage mode (emptyDir) guarantees a ~6-8 min COLD start on an
    # empty volume, and a budget below that makes a default install
    # crash-loop. Healthy warm boots (~20 s, v2 indexes) still pass quickly: the
    # startup probe stops at the first success and only then hand over to
    # readiness/liveness.
    failureThreshold: 120
  readiness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 0
    # 20s x 6 = 120 s of sustained failure before a restart. Restarting this
    # pod costs minutes (multi-GB index load), so the threshold is
    # deliberately lenient; /healthz is cheap and never touches the indexes.
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6

resources:
  requests:
    cpu: 500m
    memory: 10Gi
  limits:
    # No CPU limit (avoids throttling the index build / GC); memory limit
    # sized above warm RSS with headroom for a rebuild spike.
    memory: 14Gi

# Datasets storage. Default: emptyDir (ephemeral, fine for tests — every pod
# start re-downloads and re-builds unless the volume happens to survive).
# Production: set enabled: true for a PVC (created by the chart unless
# existingClaim is set) and mount a volume that already contains pre-built
# *.gob indexes (see README "Deployment" for how to warm it).
persistence:
  enabled: false
  # Use an already-existing claim instead of creating one.
  existingClaim: ""
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}
  emptyDir:
    # Caps ephemeral storage usage; raw datasets + indexes land well under
    # this, but a runaway write must evict rather than fill the node.
    sizeLimit: 12Gi

service:
  type: ClusterIP
  port: 80

# NOTE (Baikonur): the Baikonur cluster runs Traefik as its ingress
# controller. Adopters must decide IngressRoute-vs-Ingress there — this chart
# ships standard Ingress with an overridable className (set it to Traefik's
# class) and pass-through annotations for whatever Traefik-specific object
# the adoption chooses to layer on. The tracked decision lives in the ops
# handoff, not in this repo.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: city-finder.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Skip by default AND at single-replica scale: with replicaCount: 1 a PDB
# only blocks node drains, so the template refuses to render it unless
# replicaCount >= 2 — enabling the flag alone is not enough.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# The server drains in ~10 s; 30 s leaves margin without stretching
# rollouts.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
