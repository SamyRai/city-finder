apiVersion: v2
name: city-finder
description: |
  Nearest-city lookup HTTP API over the full GeoNames dataset (S2 geometry).
  Public, read-only API: no secrets, no service accounts with token mount,
  no external auth.
type: application
# Chart version tracks the deployment packaging; appVersion tracks the server
# and MUST equal the latest released version in CHANGELOG.md (the image tag
# defaults to it). CI fails on drift; the release job fails on a tag that
# does not match.
version: 1.0.2
appVersion: "1.4.0"
home: https://github.com/SamyRai/cityFinder
sources:
  - https://github.com/SamyRai/cityFinder
